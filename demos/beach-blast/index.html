<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#32b7ff"><title>Beach Blast</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071a35;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}body{touch-action:none;overscroll-behavior:none}#app{position:fixed;inset:0;overflow:hidden;background:#25b7f5}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;inset:0;pointer-events:none;color:#fff;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:flex-start}.balls{min-width:92px;text-align:center;padding:7px 12px 9px;border-radius:17px;background:linear-gradient(#b34cff,#6d22d5);border:3px solid #ffd34b;box-shadow:0 4px 0 #9b4c00,0 8px 18px #0004;font-weight:900;text-shadow:0 2px #0006}.balls small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.balls b{display:block;font-size:29px;line-height:1}.actions{display:flex;gap:9px;pointer-events:auto}.btn{width:50px;height:50px;border-radius:50%;border:3px solid #ffd34b;background:linear-gradient(#a947f5,#6420c8);color:#fff;font-size:22px;font-weight:900;box-shadow:0 4px 0 #8b4300,0 8px 18px #0004}.lvl{position:absolute;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:99px;background:#06356c66;backdrop-filter:blur(8px);font-size:12px;font-weight:900}.tip{position:absolute;left:50%;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 4px);transform:translateX(-50%);white-space:nowrap;max-width:92vw;padding:8px 12px;border-radius:99px;background:#071a35aa;backdrop-filter:blur(8px);font-size:12px;font-weight:800}.overlay{position:absolute;inset:0;display:none;place-items:center;padding:22px;background:#06152b66;backdrop-filter:blur(8px);pointer-events:auto}.overlay.show{display:grid}.card{width:min(340px,92vw);padding:24px 20px 20px;border-radius:28px;background:linear-gradient(#fff6d6,#fff);border:5px solid #ffd34b;box-shadow:0 9px 0 #a84f00,0 25px 60px #0007;text-align:center;color:#27345f}.card h1{margin:0 0 7px;font-size:32px}.card p{margin:0 0 16px;color:#667091;font-weight:700}.stars{font-size:34px;margin:4px 0 16px}.primary,.secondary{width:100%;border:0;border-radius:17px;padding:14px 16px;font-size:17px;font-weight:900}.primary{background:linear-gradient(#28dd70,#0daf4e);color:#fff;box-shadow:0 5px 0 #087834}.secondary{margin-top:10px;background:#edf1ff;color:#334276}@media(min-width:700px){#app{left:50%;right:auto;width:430px;transform:translateX(-50%);border-radius:34px;box-shadow:0 0 80px #0008}}
</style></head><body><div id="app"><canvas id="game"></canvas><div class="hud"><div class="lvl" id="lvl">NIVÅ 1</div><div class="top"><div class="balls"><small>Baller</small><b id="balls">4</b></div><div class="actions"><button class="btn" id="restart" aria-label="Start på nytt">↻</button></div></div><div class="tip" id="tip">Dra på skjermen for å sikte · slipp for å skyte</div></div><div class="overlay" id="overlay"><div class="card"><h1 id="title">Nivå klart!</h1><div class="stars" id="stars">⭐⭐⭐</div><p id="result">Godt skudd.</p><button class="primary" id="mainBtn">Neste nivå</button><button class="secondary" id="again">Spill igjen</button></div></div></div><script>
(()=>{'use strict';const app=document.querySelector('#app'),c=document.querySelector('#game'),x=c.getContext('2d'),ballsEl=document.querySelector('#balls'),lvlEl=document.querySelector('#lvl'),tip=document.querySelector('#tip'),overlay=document.querySelector('#overlay'),title=document.querySelector('#title'),stars=document.querySelector('#stars'),result=document.querySelector('#result'),mainBtn=document.querySelector('#mainBtn');let W=0,H=0,D=1,last=performance.now(),level=1,balls=4,drag=false,aim={x:0,y:-1,p:.48},shots=[],blocks=[],fx=[],won=false,platform=0,cannon={x:0,y:0},shake=0,failTimer=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
function resize(){const r=app.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*D);c.height=Math.round(H*D);x.setTransform(D,0,0,D,0,0);platform=H*.58;cannon={x:W*.5,y:H*.89};reset(false)}
const layouts=[[[.28,0,'box'],[.41,0,'target'],[.54,0,'box'],[.67,0,'target']],[[.30,0,'box'],[.43,0,'target'],[.56,0,'box'],[.69,0,'target'],[.43,1,'box'],[.56,1,'target']],[[.23,0,'box'],[.35,0,'target'],[.47,0,'box'],[.59,0,'target'],[.71,0,'box'],[.41,1,'target'],[.55,1,'target']]];
function reset(full=true){if(full)balls=4;shots=[];fx=[];blocks=[];drag=false;won=false;failTimer=0;overlay.classList.remove('show');const layout=layouts[(level-1)%layouts.length];for(const [px,row,type] of layout){const w=42,h=42;blocks.push({x:W*px-w/2,y:platform-h-row*45,w,h,type,vx:0,vy:0,a:0,spin:0,alive:true,ground:true})}ballsEl.textContent=balls;lvlEl.textContent='NIVÅ '+level;tip.style.opacity=1;mainBtn.textContent='Neste nivå'}
function pos(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function setAim(e){const p=pos(e),dx=p.x-cannon.x,dy=p.y-cannon.y,l=Math.hypot(dx,dy)||1;aim.x=dx/l;aim.y=dy/l;if(aim.y>-.12)aim.y=-.12;aim.p=clamp(Math.hypot(dx,dy)/Math.min(W,H),.25,.82)}
c.addEventListener('pointerdown',e=>{if(won||balls<=0)return;drag=true;c.setPointerCapture?.(e.pointerId);setAim(e);tip.style.opacity=.25;e.preventDefault()});c.addEventListener('pointermove',e=>{if(!drag)return;setAim(e);e.preventDefault()});c.addEventListener('pointerup',e=>{if(!drag)return;drag=false;shoot();e.preventDefault()});c.addEventListener('pointercancel',()=>drag=false);
function burst(px,py,n,col){for(let i=0;i<n;i++)fx.push({x:px,y:py,vx:rnd(-180,180),vy:rnd(-220,40),age:0,life:rnd(.3,.75),r:rnd(2,6),col})}
function shoot(){if(balls<=0||won)return;balls--;ballsEl.textContent=balls;const s=250+760*aim.p;shots.push({x:cannon.x+aim.x*55,y:cannon.y+aim.y*55,vx:aim.x*s,vy:aim.y*s,r:13,age:0,trail:[]});burst(cannon.x+aim.x*45,cannon.y+aim.y*45,9,'#ffd76c');shake=3;navigator.vibrate?.(15)}
function collide(s,b){const qx=clamp(s.x,b.x,b.x+b.w),qy=clamp(s.y,b.y,b.y+b.h),dx=s.x-qx,dy=s.y-qy;if(dx*dx+dy*dy>s.r*s.r)return false;const m=Math.hypot(dx,dy)||1,nx=dx/m,ny=dy/m,dot=s.vx*nx+s.vy*ny,impact=Math.hypot(s.vx,s.vy);s.vx=(s.vx-2*dot*nx)*.62;s.vy=(s.vy-2*dot*ny)*.62;b.vx+=nx*impact*.22;b.vy+=ny*impact*.18-45;b.spin+=nx*2.6;b.ground=false;b.alive=false;burst(qx,qy,b.type==='target'?28:15,b.type==='target'?'#ffe33d':'#ff9959');shake=Math.min(9,2+impact/120);navigator.vibrate?.(b.type==='target'?[22,18,22]:12);return true}
function update(dt){const g=820;for(const s of shots){s.age+=dt;s.vy+=g*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.trail.push({x:s.x,y:s.y,a:.55});if(s.trail.length>11)s.trail.shift();for(const t of s.trail)t.a-=dt*2.6;for(const b of blocks)if(b.alive&&collide(s,b))break}s.hits;shots=shots.filter(s=>s.age<6&&s.y<H+80&&s.x>-80&&s.x<W+80);for(const b of blocks){if(!b.alive&&!b.ground){b.vy+=g*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.spin*dt;b.vx*=.99;b.spin*=.985;if(b.y+b.h>=platform){b.y=platform-b.h;b.vy*=-.22;b.vx*=.7;if(Math.abs(b.vy)<20)b.ground=true}}}for(const p of fx){p.age+=dt;p.vy+=g*.55*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98}fx=fx.filter(p=>p.age<p.life);const left=blocks.filter(b=>b.alive&&b.type==='target').length;if(!won&&!left){won=true;setTimeout(()=>showWin(),500)}else if(!won&&!balls&&!shots.length&&left&&!failTimer){failTimer=setTimeout(showFail,450)}}
function showWin(){const used=4-balls;title.textContent='Nivå klart!';stars.textContent=used<=2?'⭐⭐⭐':used===3?'⭐⭐☆':'⭐☆☆';result.textContent=used<=2?'Presist og effektivt.':used===3?'Bra gjennomført.':'Nivå fullført.';mainBtn.textContent='Neste nivå';mainBtn.onclick=()=>{level++;reset(true)};overlay.classList.add('show')}
function showFail(){title.textContent='Nesten!';stars.textContent='☆☆☆';result.textContent='Prøv en annen vinkel.';mainBtn.textContent='Prøv igjen';mainBtn.onclick=()=>reset(true);overlay.classList.add('show')}
function rr(px,py,w,h,r){r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath()}
function bg(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#43c5ff');g.addColorStop(.30,'#1daee9');g.addColorStop(.305,'#0ea4dc');g.addColorStop(.38,'#f9dc94');g.addColorStop(1,'#efbd63');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#10a9dc';x.fillRect(0,H*.29,W,H*.075);x.fillStyle='#ffffffaa';for(let i=0;i<5;i++)x.fillRect(i*95+18,H*.335+(i%2)*4,55,2);palm(W*.12,H*.37,.82);palm(W*.87,H*.37,.9);x.globalAlpha=.13;x.fillStyle='#875c25';for(let i=0;i<70;i++){x.beginPath();x.arc((i*73)%W,H*.38+((i*109)%(H*.62)),1+i%2,0,7);x.fill()}x.globalAlpha=1}
function palm(px,py,s){x.save();x.translate(px,py);x.scale(s,s);x.strokeStyle='#8b5a2a';x.lineWidth=10;x.lineCap='round';x.beginPath();x.moveTo(0,60);x.quadraticCurveTo(-8,20,3,-20);x.stroke();x.strokeStyle='#2fb34a';x.lineWidth=8;for(let i=0;i<7;i++){const a=-2.7+i*.52;x.beginPath();x.moveTo(3,-20);x.quadraticCurveTo(Math.cos(a)*30,Math.sin(a)*20-27,Math.cos(a)*60,Math.sin(a)*24-16);x.stroke()}x.restore()}
function platformDraw(){const px=W*.12,w=W*.76;x.fillStyle='#0877e5';rr(px,platform-5,w,18,7);x.fill();x.fillStyle='#66cfff';x.fillRect(px+10,platform-3,w-20,4);x.fillStyle='#ef4054';x.fillRect(px+4,platform+9,w-8,6);x.fillStyle='#2c79b7';rr(W*.46,platform+13,W*.08,82,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(W*.5,platform+70,22,0,7);x.fill();x.strokeStyle='#ef4b3c';x.lineWidth=8;x.beginPath();x.arc(W*.5,platform+70,16,0,7);x.stroke()}
function blockDraw(b){if(!b.alive&&!b.ground)return;x.save();x.translate(b.x+b.w/2,b.y+b.h/2);x.rotate(b.a);x.translate(-b.w/2,-b.h/2);x.shadowColor='#0004';x.shadowBlur=8;x.shadowOffsetY=5;if(b.type==='box'){x.fillStyle='#f7932d';rr(0,0,b.w,b.h,7);x.fill();x.strokeStyle='#a94c18';x.lineWidth=4;x.stroke();x.fillStyle='#ffbd42';x.fillRect(7,5,b.w-14,b.h-10);x.fillStyle='#f17523';x.font='bold 24px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('★',b.w/2,b.h/2+1)}else{x.fillStyle='#eef3f8';rr(0,0,b.w,b.h,7);x.fill();x.strokeStyle='#6889aa';x.lineWidth=4;x.stroke();x.fillStyle='#ff334a';x.beginPath();x.arc(b.w/2,b.h/2,13,0,7);x.fill();x.fillStyle='#ffd629';x.beginPath();x.arc(b.w/2,b.h/2,7,0,7);x.fill()}x.restore()}
function cannonDraw(){const a=Math.atan2(aim.y,aim.x)+Math.PI/2;x.save();x.translate(cannon.x,cannon.y);x.rotate(a);x.fillStyle='#ff7a25';rr(-30,-18,60,80,18);x.fill();x.fillStyle='#0759c7';rr(-22,-18,44,83,14);x.fill();x.fillStyle='#248ef0';rr(-14,-13,28,72,10);x.fill();x.fillStyle='#ff9a35';x.fillRect(-30,-12,60,12);x.restore();x.fillStyle='#ff7c22';x.beginPath();x.arc(cannon.x,cannon.y+21,50,Math.PI,0);x.fill();x.fillStyle='#0868d8';x.beginPath();x.arc(cannon.x,cannon.y+21,39,Math.PI,0);x.fill();if(drag){x.save();x.setLineDash([8,9]);x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.moveTo(cannon.x+aim.x*55,cannon.y+aim.y*55);const s=250+760*aim.p;for(let t=.08;t<.8;t+=.08)x.lineTo(cannon.x+aim.x*55+aim.x*s*t,cannon.y+aim.y*55+aim.y*s*t+.5*820*t*t);x.stroke();x.restore()}}
function render(){x.save();if(shake){x.translate(rnd(-shake,shake),rnd(-shake,shake));shake*=.86;if(shake<.2)shake=0}bg();platformDraw();blocks.forEach(blockDraw);for(const s of shots){for(const t of s.trail){x.globalAlpha=clamp(t.a,0,.55);x.fillStyle='#dff6ff';x.beginPath();x.arc(t.x,t.y,7,0,7);x.fill()}x.globalAlpha=1;const g=x.createRadialGradient(s.x-5,s.y-5,2,s.x,s.y,s.r);g.addColorStop(0,'#8be9ff');g.addColorStop(.45,'#18a7ed');g.addColorStop(1,'#0755bd');x.fillStyle=g;x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();x.strokeStyle='#dff8ff';x.lineWidth=2;x.stroke()}for(const p of fx){x.globalAlpha=1-p.age/p.life;x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}x.globalAlpha=1;cannonDraw();x.restore()}
function loop(now){const dt=Math.min((now-last)/1000,.025);last=now;update(dt);render();requestAnimationFrame(loop)}document.querySelector('#restart').onclick=()=>reset(true);document.querySelector('#again').onclick=()=>reset(true);addEventListener('resize',resize,{passive:true});resize();requestAnimationFrame(loop)})();
</script></body></html>
